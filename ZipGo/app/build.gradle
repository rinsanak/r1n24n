plugins { id 'com.android.application' }
android {
    namespace 'com.r1n24n.zipgo'
    compileSdk 35
    defaultConfig {
        applicationId 'com.r1n24n.zipgo'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0-beta1'
    }
    signingConfigs {
        stable {
            def keyFile = System.getenv('ZIPGO_KEYSTORE_PATH')
            def storeSecret = System.getenv('ZIPGO_KEYSTORE_PASSWORD')
            def aliasName = System.getenv('ZIPGO_KEY_ALIAS')
            def keySecret = System.getenv('ZIPGO_KEY_PASSWORD')
            if (keyFile && storeSecret && aliasName && keySecret) {
                storeFile file(keyFile)
                storePassword storeSecret
                keyAlias aliasName
                keyPassword keySecret
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ZIPGO_KEYSTORE_PATH')) signingConfig signingConfigs.stable
        }
        debug { minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.junrar:junrar:8.1.2'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
