plugins { id 'com.android.application' }
android {
    namespace 'com.r1n24n.zipgo'
    compileSdk 35
    defaultConfig {
        applicationId 'com.r1n24n.zipgo'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0-beta1'
    }
    signingConfigs {\n        stable {\n            def keyFile = System.getenv('ZIPGO_KEYSTORE_PATH')\n            def storeSecret = System.getenv('ZIPGO_KEYSTORE_PASSWORD')\n            def aliasName = System.getenv('ZIPGO_KEY_ALIAS')\n            def keySecret = System.getenv('ZIPGO_KEY_PASSWORD')\n            if (keyFile && storeSecret && aliasName && keySecret) {\n                storeFile file(keyFile)\n                storePassword storeSecret\n                keyAlias aliasName\n                keyPassword keySecret\n            }\n        }\n    }\n    buildTypes {
        release {\n            minifyEnabled false\n            if (System.getenv('ZIPGO_KEYSTORE_PATH')) signingConfig signingConfigs.stable\n        }
        debug { minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.junrar:junrar:8.1.2'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
