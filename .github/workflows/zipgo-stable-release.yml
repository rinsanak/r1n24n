name: ZipGo stable signed release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Require signing secrets
        env:
          KEY_B64: ${{ secrets.ZIPGO_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ZIPGO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZIPGO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ZIPGO_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" || { echo "::error::Missing ZIPGO_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASS" || { echo "::error::Missing ZIPGO_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ZIPGO_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASS" || { echo "::error::Missing ZIPGO_KEY_PASSWORD secret"; exit 1; }
      - name: Restore private signing key
        env:
          KEY_B64: ${{ secrets.ZIPGO_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/zipgo-signing.jks"
      - name: Build signed release APK
        env:
          ZIPGO_KEYSTORE_PATH: ${{ runner.temp }}/zipgo-signing.jks
          ZIPGO_KEYSTORE_PASSWORD: ${{ secrets.ZIPGO_KEYSTORE_PASSWORD }}
          ZIPGO_KEY_ALIAS: ${{ secrets.ZIPGO_KEY_ALIAS }}
          ZIPGO_KEY_PASSWORD: ${{ secrets.ZIPGO_KEY_PASSWORD }}
        run: gradle --no-daemon -p ZipGo :app:assembleRelease
      - name: Verify release signature
        run: |
          APK=ZipGo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ZipGo-stable-signed-APK
          path: ZipGo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
