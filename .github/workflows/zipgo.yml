name: Build ZipGo APK
on:
  push:
    branches: [zipgo-apk-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Build debug APK
        run: gradle --no-daemon -p ZipGo :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZipGo-APK
          path: ZipGo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
